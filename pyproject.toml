[project]
name = "antes-de-rentar-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "h3>=4.1",
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6",
  "requests>=2.31",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["pipeline"]
